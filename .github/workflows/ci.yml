name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    name: Tests & Code Quality
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ditib_test
          MYSQL_USER: ditib_app
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.3 Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, redis, intl, gd, zip
          coverage: xdebug

      - name: Composer Cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Environment Setup
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST=db/DB_HOST=127.0.0.1/' .env
          sed -i 's/REDIS_HOST=redis/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=ditib_vereinsportal/DB_DATABASE=ditib_test/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=secret/' .env
          php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: PHP Code Style (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Static Analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M
        continue-on-error: true

      - name: Run Tests with Coverage
        run: |
          php artisan test --coverage --min=80
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ditib_test
          DB_USERNAME: ditib_app
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1

  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ditib-vereinsportal:${{ github.sha }} -f docker/app/Dockerfile .

      - name: Test Docker Image
        run: docker run --rm ditib-vereinsportal:${{ github.sha }} php --version
