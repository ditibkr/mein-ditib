# ══════════════════════════════════════════════════════
#  SpendenPortal – Nginx Proxy-Block
#  In deine bestehende Nginx-Konfiguration einfügen
#  (z.B. in /etc/nginx/sites-available/spendenportal)
# ══════════════════════════════════════════════════════

server {
    listen 80;
    # listen 443 ssl; ← falls du SSL direkt am Proxy terminierst
    server_name db.ditib-krefeld.info;  # ← anpassen

    # Dokumenten-Root zeigt auf den gemounteten /public Ordner
    root /home/it/docker/spendenportal_php/public;  # ← anpassen
    index index.php;

    # Maximale Upload-Größe (für PDFs)
    client_max_body_size 20M;

    # Statische Dateien direkt ausliefern – PHP wird nicht bemüht
    location /static/ {
        alias /home/it/docker/spendenportal_php/static/;  # ← anpassen
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Alle anderen Anfragen → index.php (Front-Controller)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-Anfragen an php-fpm weiterleiten
    location ~ \.php$ {
        # Container-Name aus docker-compose.yml + Port 9000
        fastcgi_pass spendenportal_php:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts für längere Jobs (PDF-Erstellung, Mail-Abruf)
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
    }

    # Sicherheit: .env und versteckte Dateien blockieren
    location ~ /\. {
        deny all;
    }
}
